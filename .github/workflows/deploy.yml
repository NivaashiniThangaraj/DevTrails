name: Deploy Aegis web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'aegis_app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Report lint issues without blocking the deploy (pre-existing warnings
        # in the demo app are non-fatal).
        continue-on-error: true
        run: flutter analyze

      - name: Build web
        # The repo is served from /DevTrails/, so the base href must match.
        run: flutter build web --base-href "/DevTrails/" --release

      - name: Disable Jekyll
        # Prevent GitHub Pages from ignoring assets whose names start with "_".
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: aegis_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
